name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build e-BK Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./e-BK-SMKN1Mejayan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-BK-SMKN1Mejayan-APK
          path: e-BK-SMKN1Mejayan.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-apk
          name: "e-BK Karier SMKN 1 Mejayan - Android APK (v1.0.0)"
          body: |
            ### 📱 Aplikasi Android e-BK Career Self-Efficacy SMKN 1 Mejayan
            
            Aplikasi Bimbingan dan Konseling Karier Berbasis TIK untuk Siswa Kelas 11 SMKN 1 Mejayan.
            Dibimbing oleh: **Drs. M. Rofik, M.Pd**
            
            **Cara Pasang di HP Android:**
            1. Unduh file `e-BK-SMKN1Mejayan.apk` di bawah.
            2. Buka file hasil unduhan di HP Android Anda.
            3. Jika muncul konfirmasi "Izinkan instalasi dari sumber ini", pilih **Izinkan / Ya**.
            4. Klik **Install / Pasang**.
            5. Buka aplikasi e-BK Karier dari daftar aplikasi HP.
          files: e-BK-SMKN1Mejayan.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
