<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Compass / Target Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Career Pathway Arc -->
  <path d="M 140 380 C 180 300, 240 280, 360 210" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="6 14" opacity="0.6"/>

  <!-- Compass Needle / Direction Arrow -->
  <path d="M 256 120 L 290 240 L 256 220 L 222 240 Z" fill="#62b6cb" filter="url(#shadow)"/>
  <path d="M 256 340 L 290 260 L 256 270 L 222 260 Z" fill="#bee9e8" opacity="0.8"/>

  <!-- Graduation Cap (Career & Education) -->
  <g transform="translate(0, 10)" filter="url(#shadow)">
    <polygon points="256,190 380,240 256,290 132,240" fill="url(#capGrad)"/>
    <polygon points="256,290 340,260 340,300 256,335 172,300 172,260" fill="#bee9e8"/>
    <!-- Tassel -->
    <path d="M 360 248 C 365 270, 375 290, 375 315" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <circle cx="375" cy="320" r="7" fill="#ffd166"/>
  </g>

  <!-- Small Stars of Success -->
  <circle cx="390" cy="170" r="10" fill="#ffd166"/>
  <circle cx="120" cy="180" r="6" fill="#ffffff" opacity="0.7"/>
</svg>
